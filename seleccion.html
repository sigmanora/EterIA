<!DOCTYPE html>
<html lang="es">

<head>

  >

  <style>

    /* =========================================================
       ETERIA — SELECCIÓN
       ========================================================= */

    .selection-card {
      width: min(1200px, 100%);
      max-width: none !important;
    }


    .selection-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }


    .upload-box {
      width: 100%;
      margin-top: 25px;
    }


    .file-input-wrapper {

      border-radius: 12px;

      background: var(--bg-soft);

      transition: 0.2s ease;
    }

    }


    .file-input-wrapper input[type="file"] {

      color: var(--ink-soft);
      font-size: 13px;
    }

      font-family: var(--font-mono);

    }

      min-width: 220px;

    }


    .status {

      padding: 12px 14px;
      border-radius: 9px;

      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.5;
    }


    .status.loading {

    }


    .status.success {
      border-color: rgba(80, 200, 120, 0.35);
      color: #8ee6a8;
    }


    .status.error {
      border-color: rgba(217, 70, 63, 0.45);
      color: #ff8b84;
    }


    .hidden {
      display: none !important;
    }


    /* =========================================================
       CURSOS
       ========================================================= */

    #resultados {
      margin-top: 38px;
    }


    .courses-title {
      margin: 0 0 6px;
      font-family: var(--font-display);
      font-size: 23px;
      font-weight: 600;
      color: var(--ink);
    }


    .courses-description {

      color: var(--ink-soft);

      line-height: 1.5;
    }


    .course-tabs {
      display: flex;

    /* =========================================================

       ========================================================= */

    .course-section {
      margin-top: 12px;
    }


    .course-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin: 8px 0 18px;
      flex-wrap: wrap;
    }


    .course-name {
      margin: 0;
      font-family: var(--font-display);
      font-size: 25px;
      font-weight: 600;
      color: var(--ink);
    }


    /* =========================================================
       GRUPOS
       ========================================================= */

    .candidate-group {

    }


    .candidate-group:first-of-type {

    .candidate-group-title {

      color: var(--ink);

    /* =========================================================
       TABLA

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);

    .selection-table {

    /* =========================================================

    /* =========================================================
       ÍNDICE DE APROBACIÓN

    .approval-index {

    /* =========================================================

    /* =========================================================

    /* =========================================================

    .no-results {

    button:disabled {

    /* =========================================================

    @media (max-width: 720px) {

        align-items: stretch;
      }

        width: 100%;
      }


      .course-tabs {
        margin-right: -5px;
      }

    }

  </style>

  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script>


    /* =========================================================
       CONFIGURACIÓN
       ========================================================= */

    const AYUDANTES_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiEl3Ji1OCzdYNzmO7SJ5bTW8wKaIz16yOsmsmRmxCnjmrqF9gTCglB9dYfA91uPtqrmK8y2iVTYD5/pub?gid=0&single=true&output=csv";


    const COLUMNA_NOMBRE =
      "Postulante";


    const COLUMNA_NOTA =
      "Nota Curso (mínimo 5,0)";


    const COLUMNA_CREDITOS =
      "Créditos aprobados";


    const COLUMNA_INDICE =
      "Índice Aprob.";


    const COLUMNA_COMENTARIO =
      "Comentario";


    /* =========================================================
       ELEMENTOS
       ========================================================= */

    const archivoInput =
      document.getElementById(
        "archivo"
      );


    const procesarButton =
      document.getElementById(
        "procesar"
      );


    const nombreArchivo =
      document.getElementById(
        "nombre-archivo"
      );


    const estado =
      document.getElementById(
        "estado"
      );


    const resultados =
      document.getElementById(
        "resultados"
      );


    const courseTabs =
      document.getElementById(
        "course-tabs"
      );


    const courseSection =
      document.getElementById(
        "course-section"
      );


    let archivoSeleccionado =
      null;


    let registroAyudantes =
      null;


    let cursos =
      [];


    let cursoActivo =
      0;


    /* =========================================================
       UTILIDADES
       ========================================================= */

    function textoSeguro(valor) {

      if (
        valor === null ||
        valor === undefined
      ) {
        return "";
      }


      return String(valor)
        .trim();
    }


    function normalizarTexto(
      valor = ""
    ) {

      return textoSeguro(valor)

        .replace(
          /"/g,
          ""
        )

        .normalize("NFD")

        .replace(
          /[\u0300-\u036f]/g,
          ""
        )

        .toLowerCase()

        .replace(
          /\s+/g,
          " "
        )

        .trim();

    }


    function normalizarNombre(
      valor = ""
    ) {

      const limpio =
        textoSeguro(valor)
          .replace(
            /"/g,
            ""
          )
          .trim();


      /*
       * Si viene como:
       *
       * APELLIDOS, NOMBRES
       *
       * lo transformamos a:
       *
       * NOMBRES APELLIDOS
       */

      if (
        limpio.includes(",")
      ) {

        const partes =
          limpio.split(",");


        const apellidos =
          partes
            .shift()
            .trim();


        const nombres =
          partes
            .join(",")
            .trim();


        return normalizarTexto(
          `${nombres} ${apellidos}`
        );
      }


      return normalizarTexto(
        limpio
      );

    }


    function normalizarRut(
      valor = ""
    ) {

      return textoSeguro(valor)
        .toUpperCase()
        .replace(
          /[\s.\-]/g,
          ""
        );

    }


    function parseNumero(
      valor
    ) {

      if (
        typeof valor === "number"
      ) {

        return Number.isFinite(valor)
          ? valor
          : null;

      }


      const texto =
        textoSeguro(valor);


      if (!texto) {
        return null;
      }


      let limpio =
        texto
          .replace(
            /\s/g,
            ""
          )
          .replace(
            "%",
            ""
          );


      /*
       * Maneja números como:
       *
       * 6,5
       * 6.5
       * 120
       */

      if (
        limpio.includes(",")
      ) {

        limpio =
          limpio
            .replace(
              /\./g,
              ""
            )
            .replace(
              ",",
              "."
            );

      }


      const numero =
        Number(limpio);


      if (
        !Number.isFinite(numero)
      ) {

        return null;
      }


      return numero;

    }


    function evaluacionNumero(
      valor
    ) {

      const numero =
        parseInt(
          textoSeguro(valor),
          10
        );


      return (
        Number.isInteger(numero) &&
        numero >= 1 &&
        numero <= 4
      )
        ? numero
        : null;

    }


    function mostrarEstado(
      mensaje,
      tipo = ""
    ) {

      estado.textContent =
        mensaje;


      estado.className =
        `status ${tipo}`.trim();

    }


    /* =========================================================
       ENCONTRAR COLUMNA
       ========================================================= */

    function encontrarColumna(
      cabeceras,
      nombres
    ) {

      /*
       * Primero buscamos coincidencia exacta.
       */

      for (
        const nombre
        of nombres
      ) {

        const buscado =
          normalizarTexto(
            nombre
          );


        const indice =
          cabeceras.findIndex(
            cabecera =>
              normalizarTexto(
                cabecera
              ) === buscado
          );


        if (
          indice >= 0
        ) {

          return indice;
        }

      }


      /*
       * Luego permitimos coincidencia
       * parcial.
       */

      for (
        const nombre
        of nombres
      ) {

        const buscado =
          normalizarTexto(
            nombre
          );


        const indice =
          cabeceras.findIndex(
            cabecera =>
              normalizarTexto(
                cabecera
              ).includes(buscado)
          );


        if (
          indice >= 0
        ) {

          return indice;
        }

      }


      return -1;

    }


    /* =========================================================
       CSV DEL REGISTRO
       ========================================================= */

    function parseCSV(
      texto
    ) {

      const filas = [];

      let fila = [];

      let campo = "";

      let dentroComillas =
        false;


      for (
        let i = 0;
        i < texto.length;
        i++
      ) {

        const caracter =
          texto[i];


        const siguiente =
          texto[i + 1];


        if (
          dentroComillas
        ) {

          if (
            caracter === '"' &&
            siguiente === '"'
          ) {

            campo += '"';

            i++;

          }

          else if (
            caracter === '"'
          ) {

            dentroComillas =
              false;

          }

          else {

            campo +=
              caracter;

          }

        }


        else if (
          caracter === '"'
        ) {

          dentroComillas =
            true;

        }


        else if (
          caracter === ","
        ) {

          fila.push(
            campo
          );

          campo = "";

        }


        else if (
          caracter === "\r"
        ) {

          // Ignorar.

        }


        else if (
          caracter === "\n"
        ) {

          fila.push(
            campo
          );

          filas.push(
            fila
          );

          fila = [];

          campo = "";

        }


        else {

          campo +=
            caracter;

        }

      }


      if (
        campo.length ||
        fila.length
      ) {

        fila.push(
          campo
        );

        filas.push(
          fila
        );

      }


      return filas;

    }


    /* =========================================================
       CARGAR REGISTRO DE AYUDANTES
       ========================================================= */

    async function cargarRegistro() {

      if (
        registroAyudantes
      ) {

        return registroAyudantes;
      }


      const respuesta =
        await fetch(
          AYUDANTES_URL,
          {
            cache:
              "no-store"
          }
        );


      if (
        !respuesta.ok
      ) {

        throw new Error(
          "No se pudo acceder al registro de ayudantes."
        );

      }


      const texto =
        await respuesta.text();


      const filas =
        parseCSV(
          texto
        );


      if (
        filas.length < 2
      ) {

        throw new Error(
          "El registro de ayudantes está vacío."
        );

      }


      const cabeceras =
        filas[0];


      const indiceNombre =
        encontrarColumna(
          cabeceras,
          [
            "Postulante",
            "Nombre",
            "Nombre completo",
            "Alumno",
            "Estudiante"
          ]
        );


      const indiceRut =
        encontrarColumna(
          cabeceras,
          [
            "RUT",
            "R.U.T.",
            "Rut postulante"
          ]
        );


      const indiceEvaluacion =
        encontrarColumna(
          cabeceras,
          [
            "Evaluación",
            "Evaluacion",
            "Evaluación final",
            "Puntaje",
            "Nota evaluación"
          ]
        );


      const nombreCol =
        indiceNombre >= 0
          ? indiceNombre
          : 0;


      const rutCol =
        indiceRut >= 0
          ? indiceRut
          : 1;


      const evaluacionCol =
        indiceEvaluacion >= 0
          ? indiceEvaluacion
          : 2;


      registroAyudantes =
        filas
          .slice(1)
          .filter(
            fila =>
              textoSeguro(
                fila[
                  nombreCol
                ]
              )
          )
          .map(
            fila => ({

              nombre:
                textoSeguro(
                  fila[
                    nombreCol
                  ]
                ),

              rut:
                textoSeguro(
                  fila[
                    rutCol
                  ]
                ),

              evaluacion:
                evaluacionNumero(
                  fila[
                    evaluacionCol
                  ]
                )

            })
          );


      return registroAyudantes;

    }


    /* =========================================================
       ÍNDICES DEL REGISTRO
       ========================================================= */

    function construirIndices(
      registro
    ) {

      const porRut =
        new Map();


      const porNombre =
        new Map();


      for (
        const persona
        of registro
      ) {

        const rut =
          normalizarRut(
            persona.rut
          );


        const nombre =
          normalizarNombre(
            persona.nombre
          );


        if (
          rut &&
          !porRut.has(rut)
        ) {

          porRut.set(
            rut,
            persona
          );

        }


        if (
          nombre &&
          !porNombre.has(nombre)
        ) {

          porNombre.set(
            nombre,
            persona
          );

        }

      }


      return {
        porRut,
        porNombre
      };

    }


    /* =========================================================
       BUSCAR PERSONA
       ========================================================= */

    function buscarPersona(
      indices,
      rut,
      nombre
    ) {

      /*
       * Primero intentamos por RUT.
       */

      if (
        rut
      ) {

        const persona =
          indices.porRut.get(
            rut
          );


        if (
          persona
        ) {

          return persona;
        }

      }


      /*
       * Si no encontramos RUT,
       * buscamos por nombre.
       */

      if (
        nombre
      ) {

        const persona =
          indices.porNombre.get(
            nombre
          );


        if (
          persona
        ) {

          return persona;
        }

      }


      return null;

    }


    /* =========================================================
       ENCONTRAR FILA DE CABECERAS
       ========================================================= */

    function encontrarCabecera(
      hoja
    ) {

      const rango =
        XLSX.utils.decode_range(
          hoja["!ref"] ||
          "A1:A1"
        );


      for (
        let fila = rango.s.r;
        fila <= rango.e.r;
        fila++
      ) {

        for (
          let columna = rango.s.c;
          columna <= rango.e.c;
          columna++
        ) {

          const celda =
            hoja[
              XLSX.utils.encode_cell({
                r: fila,
                c: columna
              })
            ];


          if (
            normalizarTexto(
              celda?.v
            ) ===
            normalizarTexto(
              COLUMNA_NOMBRE
            )
          ) {

            return fila;

          }

        }

      }


      return -1;

    }


    /* =========================================================
       DETERMINAR TIPO
       ========================================================= */

    function determinarTipo(
      comentario
    ) {

      const texto =
        normalizarTexto(
          comentario
        );


      /*
       * Si contiene cualquiera de estas
       * expresiones, lo consideramos
       * auxiliar de control.
       */

      if (
        texto.includes(
          "aux de control"
        ) ||
        texto.includes(
          "auxiliar de control"
        )
      ) {

        return "Auxiliares de control";

      }


      return "Ayudantes";

    }


    /* =========================================================
       PROCESAR CURSO
       ========================================================= */

    function procesarCurso(
      nombreHoja,
      hoja,
      indices
    ) {

      const filaCabecera =
        encontrarCabecera(
          hoja
        );


      if (
        filaCabecera < 0
      ) {

        return null;
      }


      const rango =
        XLSX.utils.decode_range(
          hoja["!ref"]
        );


      /*
       * GUARDAMOS TODAS LAS COLUMNAS
       * DEL EXCEL.
       */

      const cabeceras =
        [];


      for (
        let columna = rango.s.c;
        columna <= rango.e.c;
        columna++
      ) {

        let encabezado =
          textoSeguro(
            hoja[
              XLSX.utils.encode_cell({
                r: filaCabecera,
                c: columna
              })
            ]?.v
          );


        /*
         * Si una columna está vacía,
         * le ponemos un nombre temporal.
         *
         * NO eliminamos la columna.
         */

        if (
          !encabezado
        ) {

          encabezado =
            `Columna ${columna + 1}`;

        }


        cabeceras.push(
          encabezado
        );

      }


      const indiceNombre =
        encontrarColumna(
          cabeceras,
          [
            COLUMNA_NOMBRE
          ]
        );


      if (
        indiceNombre < 0
      ) {

        return null;
      }


      const indiceNota =
        encontrarColumna(
          cabeceras,
          [
            COLUMNA_NOTA,
            "Nota curso",
            "Nota Curso"
          ]
        );


      const indiceCreditos =
        encontrarColumna(
          cabeceras,
          [
            COLUMNA_CREDITOS
          ]
        );


      const indiceAprobacion =
        encontrarColumna(
          cabeceras,
          [
            COLUMNA_INDICE,
            "Índice Aprob.",
            "Indice Aprob."
          ]
        );


      const indiceComentario =
        encontrarColumna(
          cabeceras,
          [
            COLUMNA_COMENTARIO,
            "Comentarios",
            "Comentario adicional"
          ]
        );


      /*
       * RUT.
       *
       * Primero buscamos una columna llamada RUT.
       */

      let indiceRut =
        encontrarColumna(
          cabeceras,
          [
            "RUT",
            "R.U.T.",
            "Rut postulante"
          ]
        );


      /*
       * Si no existe una columna RUT,
       * usamos la columna que viene
       * inmediatamente después de Postulante.
       *
       * Esto mantiene compatibilidad
       * con tu Excel actual.
       */

      if (
        indiceRut < 0
      ) {

        indiceRut =
          indiceNombre + 1;

      }


      const postulantes =
        [];


      for (
        let fila = filaCabecera + 1;
        fila <= rango.e.r;
        fila++
      ) {

        const nombreOriginal =
          textoSeguro(
            hoja[
              XLSX.utils.encode_cell({
                r: fila,
                c: indiceNombre
              })
            ]?.v
          );


        /*
         * Filas sin nombre no son postulantes.
         */

        if (
          !nombreOriginal
        ) {

          continue;
        }


        const rutOriginal =
          indiceRut >= 0
            ? textoSeguro(
                hoja[
                  XLSX.utils.encode_cell({
                    r: fila,
                    c: indiceRut
                  })
                ]?.v
              )
            : "";


        const rut =
          normalizarRut(
            rutOriginal
          );


        const nombre =
          normalizarNombre(
            nombreOriginal
          );


        /*
         * BUSCAMOS EN REGISTRO
         */

        const personaRegistro =
          buscarPersona(
            indices,
            rut,
            nombre
          );


        const notaRegistro =
          personaRegistro
            ? personaRegistro.evaluacion
            : null;


        /*
         * NOTA DEL CURSO
         */

        const nota =
          indiceNota >= 0
            ? parseNumero(
                hoja[
                  XLSX.utils.encode_cell({
                    r: fila,
                    c: indiceNota
                  })
                ]?.v
              )
            : null;


        /*
         * CRÉDITOS
         */

        const creditos =
          indiceCreditos >= 0
            ? parseNumero(
                hoja[
                  XLSX.utils.encode_cell({
                    r: fila,
                    c: indiceCreditos
                  })
                ]?.v
              )
            : null;


        /*
         * ÍNDICE DE APROBACIÓN
         */

        const indiceAprobacion =
          indiceAprobacion >= 0
            ? parseNumero(
                hoja[
                  XLSX.utils.encode_cell({
                    r: fila,
                    c: indiceAprobacion
                  })
                ]?.v
              )
            : null;


        /*
         * COMENTARIO ORIGINAL DEL EXCEL
         */

        const comentario =
          indiceComentario >= 0
            ? textoSeguro(
                hoja[
                  XLSX.utils.encode_cell({
                    r: fila,
                    c: indiceComentario
                  })
                ]?.v
              )
            : "";


        /*
         * TIPO:
         *
         * Auxiliar de control
         * o
         * Ayudante
         */

        const tipo =
          determinarTipo(
            comentario
          );


        /*
         * GUARDAMOS TODAS LAS COLUMNAS
         * ORIGINALES.
         */

        const valoresOriginales =
          [];


        for (
          let columna = rango.s.c;
          columna <= rango.e.c;
          columna++
        ) {

          valoresOriginales.push(
            hoja[
              XLSX.utils.encode_cell({
                r: fila,
                c: columna
              })
            ]?.v ?? ""
          );

        }


        postulantes.push({

          nombre:
            nombreOriginal,

          rut:
            rutOriginal,

          nota,

          notaRegistro,

          indiceAprobacion,

          creditos,

          comentario,

          tipo,

          valoresOriginales

        });

      }


      /*
       * =====================================================
       * ORDEN PRINCIPAL
       * =====================================================
       *
       * 4
       * 3
       * 2
       * 1
       * sin registro
       *
       * Dentro de cada grupo:
       *
       * Nota Curso mayor → menor
       */

      postulantes.sort(
        (a, b) => {

          const registroA =
            a.notaRegistro === null
              ? -1
              : a.notaRegistro;


          const registroB =
            b.notaRegistro === null
              ? -1
              : b.notaRegistro;


          /*
           * Primero Nota Registro.
           */

          if (
            registroA !==
            registroB
          ) {

            return (
              registroB -
              registroA
            );

          }


          /*
           * Luego Nota Curso.
           */

          const notaA =
            a.nota === null
              ? -Infinity
              : a.nota;


          const notaB =
            b.nota === null
              ? -Infinity
              : b.nota;


          return (
            notaB -
            notaA
          );

        }
      );


      return {

        nombre:
          nombreHoja,

        cabeceras,

        postulantes

      };

    }


    /* =========================================================
       PROCESAR ARCHIVO
       ========================================================= */

    async function procesarArchivo() {

      if (
        !archivoSeleccionado
      ) {

        return;
      }


      procesarButton.disabled =
        true;


      resultados.classList.add(
        "hidden"
      );


      mostrarEstado(
        "Cargando registro de ayudantes…",
        "loading"
      );


      try {

        /*
         * CARGAMOS EL REGISTRO
         */

        const registro =
          await cargarRegistro();


        mostrarEstado(
          "Procesando postulaciones…",
          "loading"
        );


        /*
         * LEEMOS EXCEL
         */

        const datos =
          await archivoSeleccionado
            .arrayBuffer();


        const workbook =
          XLSX.read(
            datos,
            {
              type:
                "array",
              cellDates:
                true
            }
          );


        const indices =
          construirIndices(
            registro
          );


        cursos =
          [];


        /*
         * PROCESAMOS CADA HOJA
         */

        for (
          const nombreHoja
          of workbook.SheetNames
        ) {

          const hoja =
            workbook.Sheets[
              nombreHoja
            ];


          const curso =
            procesarCurso(
              nombreHoja,
              hoja,
              indices
            );


          if (
            curso &&
            curso.postulantes.length
          ) {

            cursos.push(
              curso
            );

          }

        }


        if (
          cursos.length === 0
        ) {

          throw new Error(
            'No se encontraron hojas con una columna "Postulante".'
          );

        }


        cursoActivo =
          0;


        renderCursos();


        resultados.classList.remove(
          "hidden"
        );


        mostrarEstado(
          "Postulaciones procesadas correctamente.",
          "success"
        );

      }


      catch (
        error
      ) {

        console.error(
          error
        );


        resultados.classList.add(
          "hidden"
        );


        mostrarEstado(
          error.message ||
          "Ocurrió un error al procesar el archivo.",
          "error"
        );

      }


      finally {

        procesarButton.disabled =
          false;

      }

    }


    /* =========================================================
       ESCAPAR HTML
       ========================================================= */

    function escaparHTML(
      valor
    ) {

      return textoSeguro(
        valor
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        );

    }


    /* =========================================================
       FORMATEAR VALOR
       ========================================================= */

    function formatearValor(
      valor
    ) {

      if (
        valor === null ||
        valor === undefined ||
        valor === ""
      ) {

        return "—";
      }


      if (
        valor instanceof Date
      ) {

        return valor.toLocaleDateString(
          "es-CL"
        );

      }


      return escaparHTML(
        valor
      );

    }


    /* =========================================================
       RENDERIZAR CURSOS
       ========================================================= */

    function renderCursos() {

      renderTabs();

      renderCursoActivo();

    }


    /* =========================================================
       PESTAÑAS
       ========================================================= */

    function renderTabs() {

      courseTabs.innerHTML =
        "";


      cursos.forEach(
        (
          curso,
          indice
        ) => {

          const boton =
            document.createElement(
              "button"
            );


          boton.type =
            "button";


          boton.className =
            `course-tab ${
              indice === cursoActivo
                ? "active"
                : ""
            }`;


          boton.textContent =
            curso.nombre;


          boton.addEventListener(
            "click",
            () => {

              cursoActivo =
                indice;


              renderCursos();

            }
          );


          courseTabs.appendChild(
            boton
          );

        }
      );

    }


    /* =========================================================
       CURSO ACTIVO
       ========================================================= */

    function renderCursoActivo() {

      const curso =
        cursos[
          cursoActivo
        ];


      if (
        !curso
      ) {

        courseSection.innerHTML =
          `
            <div class="no-results">
              No hay cursos disponibles.
            </div>
          `;


        return;

      }


      /*
       * SEPARAMOS EN DOS GRUPOS.
       *
       * SIN RESUMEN.
       */

      const auxiliares =
        curso.postulantes.filter(
          persona =>
            persona.tipo ===
            "Auxiliares de control"
        );


      const ayudantes =
        curso.postulantes.filter(
          persona =>
            persona.tipo ===
            "Ayudantes"
        );


      courseSection.innerHTML =
        `

          <div class="course-header">

            <div>

              <h3 class="course-name">

                ${escaparHTML(
                  curso.nombre
                )}

              </h3>

            </div>

          </div>


          <!-- ===============================================
               AUXILIARES DE CONTROL
               =============================================== -->

          <section
            class="candidate-group"
          >

            <h4 class="candidate-group-title">
              Auxiliares de control
            </h4>


            ${
              auxiliares.length
                ? `

                  <div class="table-wrapper">

                    <table class="selection-table">

                      <thead>

                        ${renderEncabezados(
                          curso.cabeceras
                        )}

                      </thead>


                      <tbody>

                        ${renderFilas(
                          auxiliares,
                          curso.cabeceras
                        )}

                      </tbody>

                    </table>

                  </div>

                `
                : `

                  <div class="no-results">

                    No hay postulantes para
                    Auxiliares de control.

                  </div>

                `
            }

          </section>


          <!-- ===============================================
               AYUDANTES
               =============================================== -->

          <section
            class="candidate-group"
          >

            <h4 class="candidate-group-title">
              Ayudantes
            </h4>


            ${
              ayudantes.length
                ? `

                  <div class="table-wrapper">

                    <table class="selection-table">

                      <thead>

                        ${renderEncabezados(
                          curso.cabeceras
                        )}

                      </thead>


                      <tbody>

                        ${renderFilas(
                          ayudantes,
                          curso.cabeceras
                        )}

                      </tbody>

                    </table>

                  </div>

                `
                : `

                  <div class="no-results">

                    No hay postulantes para
                    Ayudantes.

                  </div>

                `
            }

          </section>

        `;

    }


    /* =========================================================
       ENCABEZADOS
       ========================================================= */

    function renderEncabezados(
      cabeceras
    ) {

      let html =
        "<tr>";


      /*
       * PRIMERA COLUMNA:
       * posición.
       */

      html +=
        `
          <th class="position">
            #
          </th>
        `;


      /*
       * NUEVA COLUMNA:
       *
       * Nota Registro
       *
       * queda inmediatamente
       * a la izquierda de Postulante.
       */

      html +=
        `
          <th>
            Nota Registro
          </th>
        `;


      /*
       * DESPUÉS MOSTRAMOS TODAS
       * LAS COLUMNAS ORIGINALES.
       */

      cabeceras.forEach(
        cabecera => {

          /*
           * No modificamos los nombres
           * originales.
           */

          html +=
            `
              <th>
                ${escaparHTML(
                  cabecera
                )}
              </th>
            `;

        }
      );


      html +=
        "</tr>";


      return html;

    }


    /* =========================================================
       FILAS
       ========================================================= */

    function renderFilas(
      postulantes,
      cabeceras
    ) {

      return postulantes

        .map(
          (
            persona,
            indice
          ) => {


            /* ================================================
               NOTA REGISTRO
               ================================================ */

            let claseRegistro =
              "evaluation-none";


            let textoRegistro =
              "—";


            if (
              persona.notaRegistro !==
              null
            ) {

              textoRegistro =
                persona.notaRegistro;


              claseRegistro =
                persona.notaRegistro >= 3
                  ? "evaluation-good"
                  : "evaluation-bad";

            }


            /* ================================================
               CRÉDITOS
               ================================================ */

            const pocosCreditos =
              persona.creditos !== null &&
              persona.creditos < 120;


            const claseCreditos =
              pocosCreditos
                ? "credits-warning"
                : "";


            const avisoCreditos =
              pocosCreditos
                ? `
                  <span class="credit-warning">
                    menos de 120
                  </span>
                `
                : "";


            /* ================================================
               FILA
               ================================================ */

            let html =
              `

                <tr>

                  <td class="position">
                    ${indice + 1}
                  </td>


                  <td>

                    <span
                      class="
                        evaluation
                        ${claseRegistro}
                      "
                    >

                      ${textoRegistro}

                    </span>

                  </td>

              `;


            /*
             * TODAS LAS COLUMNAS ORIGINALES.
             */

            cabeceras.forEach(
              (
                cabecera,
                columna
              ) => {


                const valor =
                  persona
                    .valoresOriginales[
                      columna
                    ];


                const nombreColumna =
                  normalizarTexto(
                    cabecera
                  );


                /* ==========================================
                   POSTULANTE
                   ========================================== */

                if (
                  nombreColumna ===
                  normalizarTexto(
                    COLUMNA_NOMBRE
                  )
                ) {

                  html +=
                    `

                      <td class="postulante">

                        ${formatearValor(
                          valor
                        )}

                      </td>

                    `;


                  return;

                }


                /* ==========================================
                   CRÉDITOS
                   ========================================== */

                if (
                  nombreColumna ===
                  normalizarTexto(
                    COLUMNA_CREDITOS
                  )
                ) {

                  html +=
                    `

                      <td
                        class="${claseCreditos}"
                      >

                        ${formatearValor(
                          valor
                        )}

                        ${avisoCreditos}

                      </td>

                    `;


                  return;

                }


                /* ==========================================
                   COMENTARIO
                   ========================================== */

                if (
                  nombreColumna ===
                  normalizarTexto(
                    COLUMNA_COMENTARIO
                  )
                ) {

                  html +=
                    `

                      <td class="comment-cell">

                        ${
                          valor
                            ? `
                              <div
                                class="comment-text"
                              >
                                ${formatearValor(
                                  valor
                                )}
                              </div>
                            `
                            : `
                              <span
                                class="comment-empty"
                              >
                                —
                              </span>
                            `
                        }

                      </td>

                    `;


                  return;

                }


                /* ==========================================
                   ÍNDICE DE APROBACIÓN
                   ========================================== */

                if (
                  nombreColumna ===
                  normalizarTexto(
                    COLUMNA_INDICE
                  )
                ) {

                  const valorNumerico =
                    persona.indiceAprobacion;


                  let texto =
                    formatearValor(
                      valor
                    );


                  let clase =
                    "approval-none";


                  if (
                    valorNumerico !== null
                  ) {

                    texto =
                      valorNumerico
                        .toFixed(2)
                        .replace(
                          ".",
                          ","
                        );


                    clase =
                      valorNumerico >= 0.85
                        ? "approval-good"
                        : "approval-bad";

                  }


                  html +=
                    `

                      <td>

                        <span
                          class="
                            approval-index
                            ${clase}
                          "
                        >

                          ${texto}

                        </span>

                      </td>

                    `;


                  return;

                }


                /* ==========================================
                   RESTO DE LAS COLUMNAS
                   ========================================== */

                html +=
                  `

                    <td>

                      ${formatearValor(
                        valor
                      )}

                    </td>

                  `;

              }
            );


            html +=
              `

                </tr>

              `;


            return html;

          }
        )

        .join("");

    }


    /* =========================================================
       EVENTO: SELECCIONAR ARCHIVO
       ========================================================= */

    archivoInput.addEventListener(
      "change",
      () => {

        archivoSeleccionado =
          archivoInput.files?.[0] ||
          null;


        resultados.classList.add(
          "hidden"
        );


        if (
          !archivoSeleccionado
        ) {

          nombreArchivo.textContent =
            "";


          procesarButton.disabled =
            true;


          mostrarEstado(
            "Selecciona un archivo Excel para comenzar."
          );


          return;

        }


        nombreArchivo.textContent =
          archivoSeleccionado.name;


        procesarButton.disabled =
          false;


        mostrarEstado(
          "Archivo seleccionado. Presiona «Mostrar postulantes»."
        );

      }
    );


    /* =========================================================
       EVENTO: PROCESAR
       ========================================================= */

    procesarButton.addEventListener(
      "click",
      procesarArchivo
    );


  </script>
