<script>


/* ============================================================
   CONFIGURACIÓN
   ============================================================ */


const AYUDANTES_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiEl3Ji1OCzdYNzmO7SJ5bTW8wKaIz16yOsmsmRmxCnjmrqF9gTCglB9dYfA91uPtqrmK8y2iVTYD5/pub?gid=0&single=true&output=csv";


const COLUMNA_NOMBRE =
  "Postulante";


const COLUMNA_CARGO =
  "Cargo";


const COLUMNA_COMENTARIO =
  "Comentario";


const COLUMNA_NOTA =
  "Nota Curso (mínimo 5,0)";


const COLUMNA_CREDITOS =
  "Créditos aprobados";


const COLUMNA_INDICE =
  "Índice Aprob.";


/* ============================================================
   ELEMENTOS
   ============================================================ */


const archivoInput =
  document.getElementById(
    "archivo"
  );


const procesarButton =
  document.getElementById(
    "procesar"
  );


const nombreArchivo =
  document.getElementById(
    "nombre-archivo"
  );


const estado =
  document.getElementById(
    "estado"
  );


const resultados =
  document.getElementById(
    "resultados"
  );


const courseTabs =
  document.getElementById(
    "course-tabs"
  );


const courseSection =
  document.getElementById(
    "course-section"
  );


let archivoSeleccionado =
  null;


let registroAyudantes =
  null;


let cursos =
  [];


let cursoActivo =
  0;


/* ============================================================
   UTILIDADES
   ============================================================ */


function textoSeguro(valor) {

  if (
    valor === null ||
    valor === undefined
  ) {

    return "";

  }

  return String(valor).trim();

}


function normalizarTexto(
  valor = ""
) {

  return textoSeguro(valor)

    .replace(
      /"/g,
      ""
    )

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .toLowerCase()

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}


function normalizarNombre(
  valor = ""
) {

  const limpio =
    textoSeguro(valor);


  if (
    limpio.includes(",")
  ) {

    const partes =
      limpio.split(",");


    const apellidos =
      partes.shift().trim();


    const nombres =
      partes.join(",").trim();


    return normalizarTexto(
      `${nombres} ${apellidos}`
    );

  }


  return normalizarTexto(
    limpio
  );

}


function normalizarRut(
  valor = ""
) {

  return textoSeguro(valor)
    .toUpperCase()
    .replace(
      /[\s.\-]/g,
      ""
    );

}


function parseNumero(
  valor
) {

  if (
    typeof valor === "number"
  ) {

    return Number.isFinite(valor)
      ? valor
      : null;

  }


  let texto =
    textoSeguro(valor);


  if (!texto) {

    return null;

  }


  texto =
    texto
      .replace(
        /\s/g,
        ""
      )
      .replace(
        "%",
        ""
      );


  if (
    texto.includes(",")
  ) {

    texto =
      texto
        .replace(
          /\./g,
          ""
        )
        .replace(
          ",",
          "."
        );

  }


  const numero =
    Number(texto);


  return Number.isFinite(numero)
    ? numero
    : null;

}


function evaluacionNumero(
  valor
) {

  const numero =
    parseInt(
      textoSeguro(valor),
      10
    );


  if (
    numero >= 1 &&
    numero <= 4
  ) {

    return numero;

  }


  return null;

}


function mostrarEstado(
  mensaje,
  tipo = ""
) {

  estado.textContent =
    mensaje;


  estado.className =
    `status ${tipo}`.trim();

}


/* ============================================================
   BUSCAR COLUMNA
   ============================================================ */


function encontrarColumna(
  cabeceras,
  nombres
) {

  for (
    const nombre
    of nombres
  ) {

    const buscado =
      normalizarTexto(
        nombre
      );


    const indice =
      cabeceras.findIndex(
        cabecera =>
          normalizarTexto(
            cabecera
          ) === buscado
      );


    if (
      indice >= 0
    ) {

      return indice;

    }

  }


  for (
    const nombre
    of nombres
  ) {

    const buscado =
      normalizarTexto(
        nombre
      );


    const indice =
      cabeceras.findIndex(
        cabecera =>
          normalizarTexto(
            cabecera
          ).includes(
            buscado
          )
      );


    if (
      indice >= 0
    ) {

      return indice;

    }

  }


  return -1;

}


/* ============================================================
   CSV DEL REGISTRO
   ============================================================ */


function parseCSV(
  texto
) {

  const filas = [];

  let fila = [];

  let campo = "";

  let comillas = false;


  for (
    let i = 0;
    i < texto.length;
    i++
  ) {

    const c =
      texto[i];


    const siguiente =
      texto[i + 1];


    if (
      comillas
    ) {

      if (
        c === '"' &&
        siguiente === '"'
      ) {

        campo += '"';

        i++;

      }

      else if (
        c === '"'
      ) {

        comillas =
          false;

      }

      else {

        campo += c;

      }

    }


    else if (
      c === '"'
    ) {

      comillas =
        true;

    }


    else if (
      c === ","
    ) {

      fila.push(
        campo
      );

      campo = "";

    }


    else if (
      c === "\n"
    ) {

      fila.push(
        campo
      );

      filas.push(
        fila
      );

      fila = [];

      campo = "";

    }


    else if (
      c !== "\r"
    ) {

      campo += c;

    }

  }


  if (
    campo ||
    fila.length
  ) {

    fila.push(
      campo
    );

    filas.push(
      fila
    );

  }


  return filas;

}


/* ============================================================
   CARGAR REGISTRO
   ============================================================ */


async function cargarRegistro() {

  if (
    registroAyudantes
  ) {

    return registroAyudantes;

  }


  const respuesta =
    await fetch(
      AYUDANTES_URL,
      {
        cache:
          "no-store"
      }
    );


  if (
    !respuesta.ok
  ) {

    throw new Error(
      "No se pudo acceder al registro de ayudantes."
    );

  }


  const texto =
    await respuesta.text();


  const filas =
    parseCSV(
      texto
    );


  if (
    filas.length < 2
  ) {

    throw new Error(
      "El registro de ayudantes está vacío."
    );

  }


  const cabeceras =
    filas[0];


  const indiceNombre =
    encontrarColumna(
      cabeceras,
      [
        "Postulante",
        "Nombre",
        "Nombre completo",
        "Alumno",
        "Estudiante"
      ]
    );


  const indiceRut =
    encontrarColumna(
      cabeceras,
      [
        "RUT",
        "R.U.T.",
        "Rut postulante"
      ]
    );


  const indiceEvaluacion =
    encontrarColumna(
      cabeceras,
      [
        "Evaluación",
        "Evaluacion",
        "Evaluación final",
        "Puntaje",
        "Nota evaluación",
        "Nota Registro"
      ]
    );


  const nombreCol =
    indiceNombre >= 0
      ? indiceNombre
      : 0;


  const rutCol =
    indiceRut >= 0
      ? indiceRut
      : 1;


  const evaluacionCol =
    indiceEvaluacion >= 0
      ? indiceEvaluacion
      : 2;


  registroAyudantes =
    filas
      .slice(1)
      .filter(
        fila =>
          textoSeguro(
            fila[
              nombreCol
            ]
          )
      )
      .map(
        fila => ({

          nombre:
            textoSeguro(
              fila[
                nombreCol
              ]
            ),

          rut:
            textoSeguro(
              fila[
                rutCol
              ]
            ),

          evaluacion:
            evaluacionNumero(
              fila[
                evaluacionCol
              ]
            )

        })
      );


  return registroAyudantes;

}


/* ============================================================
   ÍNDICES DEL REGISTRO
   ============================================================ */


function construirIndices(
  registro
) {

  const porRut =
    new Map();


  const porNombre =
    new Map();


  for (
    const persona
    of registro
  ) {

    const rut =
      normalizarRut(
        persona.rut
      );


    const nombre =
      normalizarNombre(
        persona.nombre
      );


    if (
      rut &&
      !porRut.has(rut)
    ) {

      porRut.set(
        rut,
        persona
      );

    }


    if (
      nombre &&
      !porNombre.has(nombre)
    ) {

      porNombre.set(
        nombre,
        persona
      );

    }

  }


  return {
    porRut,
    porNombre
  };

}


/* ============================================================
   BUSCAR PERSONA
   ============================================================ */


function buscarPersona(
  indices,
  rut,
  nombre
) {

  if (
    rut &&
    indices.porRut.has(rut)
  ) {

    return indices.porRut.get(
      rut
    );

  }


  if (
    nombre &&
    indices.porNombre.has(nombre)
  ) {

    return indices.porNombre.get(
      nombre
    );

  }


  return null;

}


/* ============================================================
   ENCONTRAR FILA DE CABECERAS
   ============================================================ */


function encontrarCabecera(
  hoja
) {

  const rango =
    XLSX.utils.decode_range(
      hoja["!ref"]
    );


  for (
    let fila = rango.s.r;
    fila <= rango.e.r;
    fila++
  ) {

    for (
      let columna = rango.s.c;
      columna <= rango.e.c;
      columna++
    ) {

      const celda =
        hoja[
          XLSX.utils.encode_cell({
            r: fila,
            c: columna
          })
        ];


      if (
        normalizarTexto(
          celda?.v
        ) ===
        normalizarTexto(
          "Postulante"
        )
      ) {

        return fila;

      }

    }

  }


  return -1;

}


/* ============================================================
   DETERMINAR TIPO
   ============================================================ */


function determinarTipo(
  cargo,
  comentario,
  primeraColumna
) {

  const cargoTexto =
    normalizarTexto(
      cargo
    );


  const comentarioTexto =
    normalizarTexto(
      comentario
    );


  const primera =
    normalizarTexto(
      primeraColumna
    );


  /*
   * PRIMERO: CARGO
   *
   * Esta es la fuente más confiable
   * del Excel que subiste.
   */

  if (
    cargoTexto.includes(
      "aux"
    ) &&
    (
      cargoTexto.includes(
        "control"
      ) ||
      cargoTexto === "aux"
    )
  ) {

    return "Aux de Control";

  }


  if (
    cargoTexto.includes(
      "ayudante"
    )
  ) {

    return "Ayudante";

  }


  /*
   * SEGUNDO: COMENTARIO
   */

  if (
    comentarioTexto.includes(
      "aux de control"
    ) ||
    comentarioTexto.includes(
      "auxiliar de control"
    ) ||
    comentarioTexto.includes(
      "auxiliar"
    ) ||
    comentarioTexto.includes(
      "aux control"
    )
  ) {

    return "Aux de Control";

  }


  /*
   * TERCERO: PRIMERA COLUMNA
   *
   * Esto sirve para MA2002,
   * donde aparecen cosas como:
   *
   * aux control
   * ayudante1
   * ayudante2
   */

  if (
    primera.includes(
      "aux"
    ) &&
    primera.includes(
      "control"
    )
  ) {

    return "Aux de Control";

  }


  if (
    primera.includes(
      "ayudante"
    )
  ) {

    return "Ayudante";

  }


  /*
   * Si no dice nada, asumimos
   * Ayudante.
   */

  return "Ayudante";

}


/* ============================================================
   PROCESAR CURSO
   ============================================================ */


function procesarCurso(
  nombreHoja,
  hoja,
  indices
) {

  const filaCabecera =
    encontrarCabecera(
      hoja
    );


  if (
    filaCabecera < 0
  ) {

    return null;

  }


  const rango =
    XLSX.utils.decode_range(
      hoja["!ref"]
    );


  /*
   * TODAS LAS CABECERAS
   */

  const cabeceras =
    [];


  for (
    let columna = rango.s.c;
    columna <= rango.e.c;
    columna++
  ) {

    let encabezado =
      textoSeguro(
        hoja[
          XLSX.utils.encode_cell({
            r: filaCabecera,
            c: columna
          })
        ]?.v
      );


    if (
      !encabezado
    ) {

      encabezado =
        `Columna ${columna + 1}`;

    }


    cabeceras.push(
      encabezado
    );

  }


  const indiceNombre =
    encontrarColumna(
      cabeceras,
      [
        COLUMNA_NOMBRE
      ]
    );


  const indiceCargo =
    encontrarColumna(
      cabeceras,
      [
        COLUMNA_CARGO
      ]
    );


  const indiceComentario =
    encontrarColumna(
      cabeceras,
      [
        COLUMNA_COMENTARIO
      ]
    );


  const indiceNota =
    encontrarColumna(
      cabeceras,
      [
        COLUMNA_NOTA
      ]
    );


  const indiceCreditos =
    encontrarColumna(
      cabeceras,
      [
        COLUMNA_CREDITOS
      ]
    );


  const indiceIndice =
    encontrarColumna(
      cabeceras,
      [
        COLUMNA_INDICE
      ]
    );


  /*
   * RUT
   */

  let indiceRut =
    encontrarColumna(
      cabeceras,
      [
        "RUT",
        "R.U.T.",
        "Rut postulante"
      ]
    );


  /*
   * En tu Excel:
   *
   * Postulante = columna F
   * RUT = columna G
   */

  if (
    indiceRut < 0
  ) {

    indiceRut =
      indiceNombre + 1;

  }


  const postulantes =
    [];


  /*
   * RECORRER FILAS
   */

  for (
    let fila =
      filaCabecera + 1;

    fila <= rango.e.r;

    fila++
  ) {

    const nombre =
      textoSeguro(
        hoja[
          XLSX.utils.encode_cell({
            r: fila,
            c: indiceNombre
          })
        ]?.v
      );


    if (
      !nombre
    ) {

      continue;

    }


    const rut =
      textoSeguro(
        hoja[
          XLSX.utils.encode_cell({
            r: fila,
            c: indiceRut
          })
        ]?.v
      );


    const cargo =
      indiceCargo >= 0
        ? textoSeguro(
            hoja[
              XLSX.utils.encode_cell({
                r: fila,
                c: indiceCargo
              })
            ]?.v
          )
        : "";


    const comentario =
      indiceComentario >= 0
        ? textoSeguro(
            hoja[
              XLSX.utils.encode_cell({
                r: fila,
                c: indiceComentario
              })
            ]?.v
          )
        : "";


    /*
     * Primera columna de la fila.
     *
     * Útil especialmente para MA2002.
     */

    const primeraColumna =
      textoSeguro(
        hoja[
          XLSX.utils.encode_cell({
            r: fila,
            c: rango.s.c
          })
        ]?.v
      );


    const nombreNormalizado =
      normalizarNombre(
        nombre
      );


    const rutNormalizado =
      normalizarRut(
        rut
      );


    const personaRegistro =
      buscarPersona(
        indices,
        rutNormalizado,
        nombreNormalizado
      );


    const notaRegistro =
      personaRegistro
        ? personaRegistro.evaluacion
        : null;


    const notaCurso =
      indiceNota >= 0
        ? parseNumero(
            hoja[
              XLSX.utils.encode_cell({
                r: fila,
                c: indiceNota
              })
            ]?.v
          )
        : null;


    const creditos =
      indiceCreditos >= 0
        ? parseNumero(
            hoja[
              XLSX.utils.encode_cell({
                r: fila,
                c: indiceCreditos
              })
            ]?.v
          )
        : null;


    const indiceAprobacion =
      indiceIndice >= 0
        ? parseNumero(
            hoja[
              XLSX.utils.encode_cell({
                r: fila,
                c: indiceIndice
              })
            ]?.v
          )
        : null;


    const tipo =
      determinarTipo(
        cargo,
        comentario,
        primeraColumna
      );


    /*
     * GUARDAMOS TODAS LAS COLUMNAS
     * ORIGINALES.
     */

    const valores =
      [];


    for (
      let columna = rango.s.c;
      columna <= rango.e.c;
      columna++
    ) {

      valores.push(
        hoja[
          XLSX.utils.encode_cell({
            r: fila,
            c: columna
          })
        ]?.v ?? ""
      );

    }


    postulantes.push({

      nombre,

      rut,

      notaRegistro,

      notaCurso,

      creditos,

      indiceAprobacion,

      tipo,

      valores

    });

  }


  /*
   * ==========================================================
   * ORDEN
   * ==========================================================
   *
   * 4
   * 3
   * 2
   * 1
   * SIN REGISTRO
   *
   * Y dentro de cada grupo:
   *
   * Nota Curso mayor → menor
   */

  postulantes.sort(
    (
      a,
      b
    ) => {

      const registroA =
        a.notaRegistro === null
          ? -1
          : a.notaRegistro;


      const registroB =
        b.notaRegistro === null
          ? -1
          : b.notaRegistro;


      if (
        registroA !==
        registroB
      ) {

        return (
          registroB -
          registroA
        );

      }


      const notaA =
        a.notaCurso === null
          ? -Infinity
          : a.notaCurso;


      const notaB =
        b.notaCurso === null
          ? -Infinity
          : b.notaCurso;


      return (
        notaB -
        notaA
      );

    }
  );


  return {

    nombre:
      nombreHoja,

    cabeceras,

    postulantes

  };

}


/* ============================================================
   PROCESAR ARCHIVO
   ============================================================ */


async function procesarArchivo() {

  if (
    !archivoSeleccionado
  ) {

    return;

  }


  procesarButton.disabled =
    true;


  resultados.classList.add(
    "hidden"
  );


  mostrarEstado(
    "Cargando registro de ayudantes…",
    "loading"
  );


  try {

    const registro =
      await cargarRegistro();


    mostrarEstado(
      "Procesando postulaciones…",
      "loading"
    );


    const datos =
      await archivoSeleccionado
        .arrayBuffer();


    const workbook =
      XLSX.read(
        datos,
        {
          type:
            "array",
          cellDates:
            true
        }
      );


    const indices =
      construirIndices(
        registro
      );


    cursos =
      [];


    for (
      const nombreHoja
      of workbook.SheetNames
    ) {

      const hoja =
        workbook.Sheets[
          nombreHoja
        ];


      const curso =
        procesarCurso(
          nombreHoja,
          hoja,
          indices
        );


      if (
        curso &&
        curso.postulantes.length
      ) {

        cursos.push(
          curso
        );

      }

    }


    if (
      cursos.length === 0
    ) {

      throw new Error(
        'No se encontraron hojas con una columna "Postulante".'
      );

    }


    cursoActivo =
      0;


    renderCursos();


    resultados.classList.remove(
      "hidden"
    );


    mostrarEstado(
      `Se cargaron ${cursos.length} cursos correctamente.`,
      "success"
    );

  }


  catch (
    error
  ) {

    console.error(
      error
    );


    resultados.classList.add(
      "hidden"
    );


    mostrarEstado(
      error.message ||
      "Ocurrió un error al procesar el archivo.",
      "error"
    );

  }


  finally {

    procesarButton.disabled =
      false;

  }

}


/* ============================================================
   ESCAPAR HTML
   ============================================================ */


function escaparHTML(
  valor
) {

  return textoSeguro(
    valor
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    );

}


/* ============================================================
   FORMATEAR VALOR
   ============================================================ */


function formatearValor(
  valor
) {

  if (
    valor === null ||
    valor === undefined ||
    valor === ""
  ) {

    return "—";

  }


  if (
    valor instanceof Date
  ) {

    return valor.toLocaleDateString(
      "es-CL"
    );

  }


  return escaparHTML(
    valor
  );

}


/* ============================================================
   RENDERIZAR
   ============================================================ */


function renderCursos() {

  renderTabs();

  renderCursoActivo();

}


/* ============================================================
   PESTAÑAS
   ============================================================ */


function renderTabs() {

  courseTabs.innerHTML =
    "";


  cursos.forEach(
    (
      curso,
      indice
    ) => {

      const boton =
        document.createElement(
          "button"
        );


      boton.type =
        "button";


      boton.className =
        `course-tab ${
          indice === cursoActivo
            ? "active"
            : ""
        }`;


      boton.textContent =
        curso.nombre;


      boton.addEventListener(
        "click",
        () => {

          cursoActivo =
            indice;


          renderCursos();

        }
      );


      courseTabs.appendChild(
        boton
      );

    }
  );

}


/* ============================================================
   CURSO ACTIVO
   ============================================================ */


function renderCursoActivo() {

  const curso =
    cursos[
      cursoActivo
    ];


  if (
    !curso
  ) {

    courseSection.innerHTML =
      `
        <div class="no-results">
          No hay cursos disponibles.
        </div>
      `;


    return;

  }


  /*
   * SEPARAMOS EN:
   *
   * AUX DE CONTROL
   * AYUDANTES
   */


  const auxiliares =
    curso.postulantes.filter(
      persona =>
        persona.tipo ===
        "Aux de Control"
    );


  const ayudantes =
    curso.postulantes.filter(
      persona =>
        persona.tipo ===
        "Ayudante"
    );


  courseSection.innerHTML =
    `

      <div class="course-header">

        <h3 class="course-name">
          ${escaparHTML(
            curso.nombre
          )}
        </h3>

      </div>


      <h4 class="group-title">
        Auxiliares de Control
      </h4>

      ${
        auxiliares.length
          ? `
            <div class="table-wrapper">

              <table class="selection-table">

                <thead>

                  ${renderEncabezados(
                    curso.cabeceras
                  )}

                </thead>

                <tbody>

                  ${renderFilas(
                    auxiliares,
                    curso.cabeceras
                  )}

                </tbody>

              </table>

            </div>
          `
          : `
            <div class="no-results">
              No hay postulantes identificados
              como Aux de Control.
            </div>
          `
      }


      <h4 class="group-title">
        Ayudantes
      </h4>

      ${
        ayudantes.length
          ? `
            <div class="table-wrapper">

              <table class="selection-table">

                <thead>

                  ${renderEncabezados(
                    curso.cabeceras
                  )}

                </thead>

                <tbody>

                  ${renderFilas(
                    ayudantes,
                    curso.cabeceras
                  )}

                </tbody>

              </table>

            </div>
          `
          : `
            <div class="no-results">
              No hay postulantes identificados
              como Ayudante.
            </div>
          `
      }

    `;

}


/* ============================================================
   ENCABEZADOS
   ============================================================ */


function renderEncabezados(
  cabeceras
) {

  let html =
    "<tr>";


  html +=
    `
      <th class="position">
        #
      </th>
    `;


  /*
   * ESTA ES LA NUEVA COLUMNA.
   *
   * QUEDA ANTES DE POSTULANTE.
   */

  html +=
    `
      <th>
        Nota Registro
      </th>
    `;


  /*
   * TIPO TAMBIÉN VA ANTES
   * DE POSTULANTE.
   */

  html +=
    `
      <th>
        Tipo
      </th>
    `;


  /*
   * AHORA TODAS LAS COLUMNAS
   * ORIGINALES DEL EXCEL.
   */

  cabeceras.forEach(
    cabecera => {

      html +=
        `
          <th>
            ${escaparHTML(
              cabecera
            )}
          </th>
        `;

    }
  );


  html +=
    "</tr>";


  return html;

}


/* ============================================================
   FILAS
   ============================================================ */


function renderFilas(
  postulantes,
  cabeceras
) {

  return postulantes

    .map(
      (
        persona,
        indice
      ) => {


        /*
         * NOTA REGISTRO
         */

        let claseRegistro =
          "evaluation-none";


        let textoRegistro =
          "—";


        if (
          persona.notaRegistro !==
          null
        ) {

          textoRegistro =
            persona.notaRegistro;


          claseRegistro =
            persona.notaRegistro >= 3
              ? "evaluation-good"
              : "evaluation-bad";

        }


        /*
         * CRÉDITOS
         */

        const pocosCreditos =
          persona.creditos !== null &&
          persona.creditos < 120;


        const claseCreditos =
          pocosCreditos
            ? "credits-warning"
            : "";


        const avisoCreditos =
          pocosCreditos
            ? `
              <span class="credit-warning">
                menos de 120
              </span>
            `
            : "";


        /*
         * TIPO
         */

        const claseTipo =
          persona.tipo ===
          "Aux de Control"
            ? "type-aux"
            : "type-ayudante";


        /*
         * FILA
         */

        let html =
          `

            <tr>

              <td class="position">
                ${indice + 1}
              </td>


              <td>

                <span
                  class="
                    evaluation
                    ${claseRegistro}
                  "
                >
                  ${textoRegistro}
                </span>

              </td>


              <td>

                <span
                  class="
                    type-badge
                    ${claseTipo}
                  "
                >
                  ${persona.tipo}
                </span>

              </td>

          `;


        /*
         * TODAS LAS COLUMNAS
         * ORIGINALES.
         */

        cabeceras.forEach(
          (
            cabecera,
            columna
          ) => {


            const valor =
              persona.valores[
                columna
              ];


            const nombreColumna =
              normalizarTexto(
                cabecera
              );


            /*
             * POSTULANTE
             */

            if (
              nombreColumna ===
              normalizarTexto(
                COLUMNA_NOMBRE
              )
            ) {

              html +=
                `

                  <td class="postulante">

                    ${formatearValor(
                      valor
                    )}

                  </td>

                `;


              return;

            }


            /*
             * CRÉDITOS
             */

            if (
              nombreColumna ===
              normalizarTexto(
                COLUMNA_CREDITOS
              )
            ) {

              html +=
                `

                  <td
                    class="${claseCreditos}"
                  >

                    ${formatearValor(
                      valor
                    )}

                    ${avisoCreditos}

                  </td>

                `;


              return;

            }


            /*
             * COMENTARIO
             */

            if (
              nombreColumna ===
              normalizarTexto(
                COLUMNA_COMENTARIO
              )
            ) {

              html +=
                `

                  <td class="comment-cell">

                    ${
                      valor
                        ? `
                          <div
                            class="comment-text"
                          >
                            ${formatearValor(
                              valor
                            )}
                          </div>
                        `
                        : "—"
                    }

                  </td>

                `;


              return;

            }


            /*
             * ÍNDICE DE APROBACIÓN
             */

            if (
              nombreColumna ===
              normalizarTexto(
                COLUMNA_INDICE
              )
            ) {

              const numero =
                persona.indiceAprobacion;


              let clase =
                "approval-none";


              let texto =
                formatearValor(
                  valor
                );


              if (
                numero !== null
              ) {

                texto =
                  numero
                    .toFixed(2)
                    .replace(
                      ".",
                      ","
                    );


                clase =
                  numero >= 0.85
                    ? "approval-good"
                    : "approval-bad";

              }


              html +=
                `

                  <td>

                    <span
                      class="
                        approval-index
                        ${clase}
                      "
                    >
                      ${texto}
                    </span>

                  </td>

                `;


              return;

            }


            /*
             * RESTO DE COLUMNAS
             */

            html +=
              `

                <td>
                  ${formatearValor(
                    valor
                  )}
                </td>

              `;

          }
        );


        html +=
          `

            </tr>

          `;


        return html;

      }
    )

    .join("");

}


/* ============================================================
   EVENTOS
   ============================================================ */


archivoInput.addEventListener(
  "change",
  () => {

    archivoSeleccionado =
      archivoInput.files?.[0] ||
      null;


    resultados.classList.add(
      "hidden"
    );


    if (
      !archivoSeleccionado
    ) {

      nombreArchivo.textContent =
        "";


      procesarButton.disabled =
        true;


      mostrarEstado(
        "Selecciona un archivo Excel para comenzar."
      );


      return;

    }


    nombreArchivo.textContent =
      archivoSeleccionado.name;


    procesarButton.disabled =
      false;


    mostrarEstado(
      "Archivo seleccionado. Presiona «Mostrar postulantes»."
    );

  }
);


procesarButton.addEventListener(
  "click",
  procesarArchivo
);


</script>
