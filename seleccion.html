  </main>  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->  <script>

    /*
     * EterIA — Selección de ayudantes
     *
     * La página:
     *
     * 1. Lee el Excel de postulaciones.
     * 2. Identifica automáticamente las hojas/cursos.
     * 3. Cruza cada postulante con el registro de evaluaciones.
     * 4. Busca primero por RUT.
     * 5. Si no hay RUT, busca por nombre.
     * 6. Muestra los resultados organizados por curso.
     *
     * No genera ni descarga ningún Excel.
     */


    /* =========================================================
       CONFIGURACIÓN
       ========================================================= */

    const AYUDANTES_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiEl3Ji1OCzdYNzmO7SJ5bTW8wKaIz16yOsmsmRmxCnjmrqF9gTCglB9dYfA91uPtqrmK8y2iVTYD5/pub?gid=0&single=true&output=csv";


    const COLUMNA_NOMBRE =
      "Postulante";

    const COLUMNA_NOTA =
      "Nota Curso (mínimo 5,0)";

    const COLUMNA_CREDITOS =
      "Créditos aprobados";


    /* =========================================================
       ELEMENTOS
       ========================================================= */

    const archivoInput =
      document.getElementById(
        "archivo"
      );

    const procesarButton =
      document.getElementById(
        "procesar"
      );

    const nombreArchivo =
      document.getElementById(
        "nombre-archivo"
      );

    const estado =
      document.getElementById(
        "estado"
      );

    const resultados =
      document.getElementById(
        "resultados"
      );

    const courseTabs =
      document.getElementById(
        "course-tabs"
      );

    const courseSection =
      document.getElementById(
        "course-section"
      );


    let archivoSeleccionado =
      null;

    let registroAyudantes =
      null;

    let cursos =
      [];

    let cursoActivo =
      0;


    /* =========================================================
       UTILIDADES
       ========================================================= */

    function textoSeguro(
      valor
    ) {

      if (
        valor === null ||
        valor === undefined
      ) {

        return "";

      }

      return String(
        valor
      ).trim();

    }


    function normalizarTexto(
      valor = ""
    ) {

      return textoSeguro(
        valor
      )
        .replace(
          /"/g,
          ""
        )
        .normalize(
          "NFD"
        )
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .toLowerCase()
        .replace(
          /\s+/g,
          " "
        )
        .trim();

    }


    function normalizarNombre(
      valor = ""
    ) {

      const limpio =
        textoSeguro(
          valor
        )
          .replace(
            /"/g,
            ""
          )
          .trim();


      /*
       * Convierte:
       *
       * APELLIDO, NOMBRE
       *
       * en:
       *
       * NOMBRE APELLIDO
       */

      if (
        limpio.includes(",")
      ) {

        const partes =
          limpio.split(",");

        const apellidos =
          partes
            .shift()
            .trim();

        const nombres =
          partes
            .join(",")
            .trim();

        return normalizarTexto(
          `${nombres} ${apellidos}`
        );

      }


      return normalizarTexto(
        limpio
      );

    }


    function normalizarRut(
      valor = ""
    ) {

      return textoSeguro(
        valor
      )
        .toUpperCase()
        .replace(
          /[\s.\-]/g,
          ""
        );

    }


    function parseNumero(
      valor
    ) {

      if (
        typeof valor === "number"
      ) {

        return Number.isFinite(
          valor
        )
          ? valor
          : null;

      }


      const texto =
        textoSeguro(
          valor
        );


      if (!texto) {
        return null;
      }


      const numero =
        Number(
          texto
            .replace(
              /\s/g,
              ""
            )
            .replace(
              ",",
              "."
            )
        );


      return Number.isFinite(
        numero
      )
        ? numero
        : null;

    }


    function evaluacionNumero(
      valor
    ) {

      const numero =
        parseInt(
          textoSeguro(
            valor
          ),
          10
        );


      return (
        Number.isInteger(
          numero
        ) &&
        numero >= 1 &&
        numero <= 4
      )
        ? numero
        : null;

    }


    function mostrarEstado(
      mensaje,
      tipo = ""
    ) {

      estado.textContent =
        mensaje;

      estado.className =
        `status ${tipo}`.trim();

    }


    /* =========================================================
       CSV
       ========================================================= */

    function parseCSV(
      texto
    ) {

      const filas =
        [];

      let fila =
        [];

      let campo =
        "";

      let dentroComillas =
        false;


      for (
        let i = 0;
        i < texto.length;
        i++
      ) {

        const caracter =
          texto[i];

        const siguiente =
          texto[i + 1];


        if (
          dentroComillas
        ) {

          if (
            caracter === '"' &&
            siguiente === '"'
          ) {

            campo += '"';

            i++;

          }

          else if (
            caracter === '"'
          ) {

            dentroComillas =
              false;

          }

          else {

            campo +=
              caracter;

          }

        }

        else if (
          caracter === '"'
        ) {

          dentroComillas =
            true;

        }

        else if (
          caracter === ","
        ) {

          fila.push(
            campo
          );

          campo =
            "";

        }

        else if (
          caracter === "\r"
        ) {

          // Ignorar.

        }

        else if (
          caracter === "\n"
        ) {

          fila.push(
            campo
          );

          filas.push(
            fila
          );

          fila =
            [];

          campo =
            "";

        }

        else {

          campo +=
            caracter;

        }

      }


      if (
        campo.length ||
        fila.length
      ) {

        fila.push(
          campo
        );

        filas.push(
          fila
        );

      }


      return filas;

    }


    /* =========================================================
       CARGAR REGISTRO DE EVALUACIONES
       ========================================================= */

    async function cargarRegistro() {

      if (
        registroAyudantes
      ) {

        return registroAyudantes;

      }


      const respuesta =
        await fetch(
          AYUDANTES_URL,
          {
            cache:
              "no-store"
          }
        );


      if (
        !respuesta.ok
      ) {

        throw new Error(
          "No se pudo acceder al registro de evaluaciones."
        );

      }


      const texto =
        await respuesta.text();


      const filas =
        parseCSV(
          texto
        );


      if (
        filas.length < 2
      ) {

        throw new Error(
          "El registro de evaluaciones está vacío."
        );

      }


      /*
       * Registro:
       *
       * columna 1 → nombre
       * columna 2 → RUT
       * columna 3 → evaluación
       */

      registroAyudantes =
        filas
          .slice(1)
          .filter(
            fila =>
              textoSeguro(
                fila[0]
              )
          )
          .map(
            fila => ({

              nombre:
                textoSeguro(
                  fila[0]
                ),

              rut:
                textoSeguro(
                  fila[1]
                ),

              evaluacion:
                evaluacionNumero(
                  fila[2]
                )

            })
          );


      return registroAyudantes;

    }


    /* =========================================================
       ÍNDICES
       ========================================================= */

    function construirIndices(
      registro
    ) {

      const porRut =
        new Map();

      const porNombre =
        new Map();


      for (
        const persona
        of registro
      ) {

        const rut =
          normalizarRut(
            persona.rut
          );

        const nombre =
          normalizarNombre(
            persona.nombre
          );


        if (
          rut &&
          !porRut.has(
            rut
          )
        ) {

          porRut.set(
            rut,
            persona
          );

        }


        if (
          nombre &&
          !porNombre.has(
            nombre
          )
        ) {

          porNombre.set(
            nombre,
            persona
          );

        }

      }


      return {
        porRut,
        porNombre
      };

    }


    /* =========================================================
       BUSCAR EVALUACIÓN
       ========================================================= */

    function buscarEvaluacion(
      indices,
      rut,
      nombre
    ) {

      /*
       * Primero RUT.
       */

      if (rut) {

        const persona =
          indices.porRut.get(
            rut
          );


        if (
          persona &&
          persona.evaluacion !==
            null
        ) {

          return persona.evaluacion;

        }

      }


      /*
       * Después nombre.
       */

      if (nombre) {

        const persona =
          indices.porNombre.get(
            nombre
          );


        if (
          persona &&
          persona.evaluacion !==
            null
        ) {

          return persona.evaluacion;

        }

      }


      return null;

    }


    /* =========================================================
       ENCONTRAR CABECERA
       ========================================================= */

    function encontrarCabecera(
      hoja
    ) {

      const rango =
        XLSX.utils.decode_range(
          hoja["!ref"] ||
          "A1:A1"
        );


      for (
        let fila =
          rango.s.r;
        fila <= rango.e.r;
        fila++
      ) {

        for (
          let columna =
            rango.s.c;
          columna <= rango.e.c;
          columna++
        ) {

          const celda =
            hoja[
              XLSX.utils.encode_cell({
                r: fila,
                c: columna
              })
            ];


          if (
            normalizarTexto(
              celda?.v
            ) ===
            normalizarTexto(
              COLUMNA_NOMBRE
            )
          ) {

            return fila;

          }

        }

      }


      return -1;

    }


    /* =========================================================
       PROCESAR CURSO
       ========================================================= */

    function procesarCurso(
      nombreHoja,
      hoja,
      indices
    ) {

      const filaCabecera =
        encontrarCabecera(
          hoja
        );


      if (
        filaCabecera < 0
      ) {

        return null;

      }


      const rango =
        XLSX.utils.decode_range(
          hoja["!ref"]
        );


      const cabeceras =
        [];


      for (
        let columna =
          rango.s.c;
        columna <= rango.e.c;
        columna++
      ) {

        cabeceras.push(
          textoSeguro(
            hoja[
              XLSX.utils.encode_cell({
                r: filaCabecera,
                c: columna
              })
            ]?.v
          )
        );

      }


      /*
       * Nombre.
       */

      const indiceNombre =
        cabeceras.findIndex(
          columna =>
            normalizarTexto(
              columna
            ) ===
            normalizarTexto(
              COLUMNA_NOMBRE
            )
        );


      if (
        indiceNombre < 0
      ) {

        return null;

      }


      /*
       * Nota.
       */

      const indiceNota =
        cabeceras.findIndex(
          columna =>
            normalizarTexto(
              columna
            ) ===
            normalizarTexto(
              COLUMNA_NOTA
            )
        );


      /*
       * Créditos.
       */

      const indiceCreditos =
        cabeceras.findIndex(
          columna =>
            normalizarTexto(
              columna
            ) ===
            normalizarTexto(
              COLUMNA_CREDITOS
            )
        );


      /*
       * RUT.
       *
       * Primero buscamos una columna
       * llamada RUT.
       */

      let indiceRut =
        cabeceras.findIndex(
          columna => {

            const nombre =
              normalizarTexto(
                columna
              );

            return (
              nombre === "rut" ||
              nombre === "r.u.t." ||
              nombre === "rut postulante"
            );

          }
        );


      /*
       * Compatibilidad con el Excel
       * original: columna G.
       */

      if (
        indiceRut < 0
      ) {

        indiceRut =
          6;

      }


      const postulantes =
        [];


      /*
       * Leer postulantes.
       */

      for (
        let fila =
          filaCabecera + 1;
        fila <= rango.e.r;
        fila++
      ) {

        const nombreOriginal =
          textoSeguro(
            hoja[
              XLSX.utils.encode_cell({
                r: fila,
                c: indiceNombre
              })
            ]?.v
          );


        if (
          !nombreOriginal
        ) {

          continue;

        }


        const rutOriginal =
          textoSeguro(
            hoja[
              XLSX.utils.encode_cell({
                r: fila,
                c: indiceRut
              })
            ]?.v
          );


        const rut =
          normalizarRut(
            rutOriginal
          );


        const nombre =
          normalizarNombre(
            nombreOriginal
          );


        const evaluacion =
          buscarEvaluacion(
            indices,
            rut,
            nombre
          );


        const nota =
          indiceNota >= 0
            ? parseNumero(
                hoja[
                  XLSX.utils.encode_cell({
                    r: fila,
                    c: indiceNota
                  })
                ]?.v
              )
            : null;


        const creditos =
          indiceCreditos >= 0
            ? parseNumero(
                hoja[
                  XLSX.utils.encode_cell({
                    r: fila,
                    c: indiceCreditos
                  })
                ]?.v
              )
            : null;


        postulantes.push({

          nombre:
            nombreOriginal,

          rut:
            rutOriginal,

          nota,

          evaluacion,

          creditos

        });

      }


      /*
       * Orden:
       *
       * 4 → 3 → 2 → 1 → sin evaluación
       *
       * En empate:
       * mayor nota primero.
       */

      postulantes.sort(
        (a, b) => {

          const evaluacionA =
            a.evaluacion === null
              ? -1
              : a.evaluacion;


          const evaluacionB =
            b.evaluacion === null
              ? -1
              : b.evaluacion;


          if (
            evaluacionA !==
            evaluacionB
          ) {

            return (
              evaluacionB -
              evaluacionA
            );

          }


          const notaA =
            a.nota === null
              ? -Infinity
              : a.nota;


          const notaB =
            b.nota === null
              ? -Infinity
              : b.nota;


          return (
            notaB -
            notaA
          );

        }
      );


      return {

        nombre:
          nombreHoja,

        postulantes

      };

    }


    /* =========================================================
       PROCESAR EXCEL
       ========================================================= */

    async function procesarArchivo() {

      if (
        !archivoSeleccionado
      ) {

        return;

      }


      procesarButton.disabled =
        true;


      resultados.classList.add(
        "hidden"
      );


      mostrarEstado(
        "Cargando registro de evaluaciones…",
        "loading"
      );


      try {

        const registro =
          await cargarRegistro();


        mostrarEstado(
          "Procesando cursos…",
          "loading"
        );


        const datos =
          await archivoSeleccionado
            .arrayBuffer();


        const workbook =
          XLSX.read(
            datos,
            {
              type:
                "array",
              cellDates:
                true
            }
          );


        const indices =
          construirIndices(
            registro
          );


        cursos =
          [];


        /*
         * Cada hoja del Excel
         * representa un curso.
         */

        for (
          const nombreHoja
          of workbook.SheetNames
        ) {

          const hoja =
            workbook.Sheets[
              nombreHoja
            ];


          const curso =
            procesarCurso(
              nombreHoja,
              hoja,
              indices
            );


          if (
            curso &&
            curso.postulantes.length
          ) {

            cursos.push(
              curso
            );

          }

        }


        if (
          cursos.length === 0
        ) {

          throw new Error(
            'No se encontraron cursos con una columna "Postulante".'
          );

        }


        cursoActivo =
          0;


        renderCursos();


        resultados.classList.remove(
          "hidden"
        );


        mostrarEstado(
          `Se cargaron ${cursos.length} cursos correctamente.`,
          "success"
        );

      }

      catch (error) {

        console.error(
          error
        );


        resultados.classList.add(
          "hidden"
        );


        mostrarEstado(
          error.message ||
          "Ocurrió un error al procesar el archivo.",
          "error"
        );

      }

      finally {

        procesarButton.disabled =
          false;

      }

    }


    /* =========================================================
       ESCAPAR HTML
       ========================================================= */

    function escaparHTML(
      valor
    ) {

      return textoSeguro(
        valor
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        );

    }


    /* =========================================================
       RENDERIZAR CURSOS
       ========================================================= */

    function renderCursos() {

      renderTabs();

      renderCursoActivo();

    }


    /* =========================================================
       PESTAÑAS
       ========================================================= */

    function renderTabs() {

      courseTabs.innerHTML =
        "";


      cursos.forEach(
        (curso, indice) => {

          const boton =
            document.createElement(
              "button"
            );


          boton.type =
            "button";


          boton.className =
            `course-tab ${
              indice === cursoActivo
                ? "active"
                : ""
            }`;


          boton.textContent =
            curso.nombre;


          boton.addEventListener(
            "click",
            () => {

              cursoActivo =
                indice;

              renderCursos();

            }
          );


          courseTabs.appendChild(
            boton
          );

        }
      );

    }


    /* =========================================================
       CURSO ACTIVO
       ========================================================= */

    function renderCursoActivo() {

      const curso =
        cursos[
          cursoActivo
        ];


      if (!curso) {

        courseSection.innerHTML =
          `
            <div class="no-results">
              No hay cursos disponibles.
            </div>
          `;

        return;

      }


      const total =
        curso.postulantes.length;


      courseSection.innerHTML =
        `

          <div class="course-header">

            <div>

              <h3 class="course-name">
                ${escaparHTML(
                  curso.nombre
                )}
              </h3>

              <p class="course-info">
                ${total}
                ${
                  total === 1
                    ? "postulante"
                    : "postulantes"
                }
              </p>

            </div>

          </div>


          <div class="table-wrapper">

            <table class="selection-table">

              <thead>

                <tr>

                  <th class="position">
                    #
                  </th>

                  <th>
                    Postulante
                  </th>

                  <th>
                    RUT
                  </th>

                  <th>
                    Nota curso
                  </th>

                  <th>
                    Evaluación
                  </th>

                  <th>
                    Créditos
                  </th>

                </tr>

              </thead>

              <tbody>

                ${renderFilas(
                  curso.postulantes
                )}

              </tbody>

            </table>

          </div>

        `;

    }


    /* =========================================================
       FILAS DE LA TABLA
       ========================================================= */

    function renderFilas(
      postulantes
    ) {

      return postulantes
        .map(
          (persona, indice) => {

            /*
             * Evaluación.
             */

            let claseEvaluacion =
              "evaluation-none";

            let textoEvaluacion =
              "—";


            if (
              persona.evaluacion !==
              null
            ) {

              textoEvaluacion =
                persona.evaluacion;


              claseEvaluacion =
                persona.evaluacion >= 3
                  ? "evaluation-good"
                  : "evaluation-bad";

            }


            /*
             * Créditos.
             */

            const pocosCreditos =
              persona.creditos !== null &&
              persona.creditos < 120;


            const claseCreditos =
              pocosCreditos
                ? "credits-warning"
                : "";


            const avisoCreditos =
              pocosCreditos
                ? `
                  <span class="credit-warning">
                    menos de 120
                  </span>
                `
                : "";


            /*
             * Nota.
             */

            const nota =
              persona.nota === null
                ? "—"
                : String(
                    persona.nota
                  ).replace(
                    ".",
                    ","
                  );


            /*
             * RUT.
             */

            const rut =
              persona.rut
                ? escaparHTML(
                    persona.rut
                  )
                : "—";


            return `

              <tr>

                <td class="position">
                  ${indice + 1}
                </td>


                <td class="postulante">
                  ${escaparHTML(
                    persona.nombre
                  )}
                </td>


                <td>
                  ${rut}
                </td>


                <td>
                  ${nota}
                </td>


                <td>

                  <span
                    class="evaluation ${claseEvaluacion}"
                  >
                    ${textoEvaluacion}
                  </span>

                </td>


                <td class="${claseCreditos}">

                  ${
                    persona.creditos === null
                      ? "—"
                      : persona.creditos
                  }

                  ${avisoCreditos}

                </td>

              </tr>

            `;

          }
        )
        .join("");

    }


    /* =========================================================
       EVENTOS
       ========================================================= */

    archivoInput.addEventListener(
      "change",
      () => {

        archivoSeleccionado =
          archivoInput.files?.[0] ||
          null;


        resultados.classList.add(
          "hidden"
        );


        if (
          !archivoSeleccionado
        ) {

          nombreArchivo.textContent =
            "";

          procesarButton.disabled =
            true;

          mostrarEstado(
            "Selecciona un archivo Excel para comenzar."
          );

          return;

        }


        nombreArchivo.textContent =
          archivoSeleccionado.name;


        procesarButton.disabled =
          false;


        mostrarEstado(
          "Archivo seleccionado. Presiona «Mostrar postulantes»."
        );

      }
    );


    procesarButton.addEventListener(
      "click",
      procesarArchivo
    );

  </script></body>
