<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EterIA — Coordinación de Evaluaciones Masivas</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="home">

  <!-- HEADER -->
  <header class="top-bar">
    <div class="top-inner">

      <a href="index.html" class="logo">
        COORDINACIÓN & CO.
      </a>

      <div class="search-wrapper">
        <div class="search-box">
          <input type="text" placeholder="Buscar por nombre o RUT" />
          <span class="icon">🔍</span>
        </div>

        <!-- LISTA DE RESULTADOS -->
        <div id="lista-resultados" class="lista-resultados"></div>
      </div>

    </div>
  </header>

  <!-- CONTENIDO -->
  <main class="container">
    <div class="card">
      <span class="badge">Panel de coordinación</span>
      <h1>Eterin.IA</h1>
      <p class="subtitle">Centraliza la selección de ayudantes y la generación de supervisiones en un solo flujo de trabajo.</p>
    </div>

    <div class="buttons">
      <a href="seleccion.html">
        <button>
          <span class="label">
            <span class="title">Seleccionar ayudantes</span>
            <span class="hint">Sube postulaciones y filtra candidatos</span>
          </span>
        </button>
      </a>
      <a href="supervisiones.html">
        <button>
          <span class="label">
            <span class="title">Generar supervisiones</span>
            <span class="hint">Crea las asignaciones a partir de un Excel</span>
          </span>
        </button>
      </a>
    </div>
  </main>

  <!-- MODAL -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn">×</button>
      <div id="resultado"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
